services:
  postgres:
    image: postgres:16-alpine
    container_name: smarttest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smarttest_ai}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-smarttest_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  smarttest-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarttest-ai-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smarttest_ai}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
