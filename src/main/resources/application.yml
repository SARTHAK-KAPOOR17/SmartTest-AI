server:
  port: 8080

spring:
  application:
    name: smarttest-ai

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smarttest_ai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

llm:
  provider: ${LLM_PROVIDER:openai}
  api-key: ${LLM_API_KEY:demo-api-key}
  model-name: ${LLM_MODEL_NAME:gpt-4o-mini}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  temperature: ${LLM_TEMPERATURE:0.2}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
  max-tokens: ${LLM_MAX_TOKENS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.smarttestai: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
